server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API in compose: the web build uses VITE_API_URL=/api by default,
  # so browser calls stay on :5173 and nginx forwards them to the api service.
  # This is what makes `docker compose up --build` work with no CORS setup.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Cache-busted Vite assets (hashed filenames) — safe to cache immutably.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router (SPA) fallback — deep links like /quiz must serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
