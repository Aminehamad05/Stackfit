apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: {{ .Release.Namespace }}
spec: 
  template:
   metadata:
    name: db-migration
   spec:
    restartPolicy: OnFailure
    imagePullSecrets:
      - name: {{ .Values.imagePullSecrets.name }}
    containers:
     - name: prisma-migrate
       imagePullPolicy: {{ .Values.db-migration.pullPolicy }}
       image: "{{ .Values.db-migration.repository }}:{{ .Values.db-migration.tag }}"
       env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingSecrets.dbsecretName }}
              key: DATABASE_URL
