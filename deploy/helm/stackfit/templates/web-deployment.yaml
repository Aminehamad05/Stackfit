apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stackfit
spec:
  replicas: 2
  selector:
    matchLabels:
       app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: aminehamad/careerpath-web:latest
          ports:
           - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20    
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: stackfit 
spec:
  type: ClusterIP
  ports:
   - port: 80
     targetPort: 80
     protocol: TCP
     name: http
  selector:
    app: web
